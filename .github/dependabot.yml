# The npm dependencies in package.json are pinned by deno.lock, so a security
# release only reaches production when someone bumps it. Dependabot opens that
# PR; CI proves it still builds before anyone merges. The JSR imports in
# deno.json are bumped by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
