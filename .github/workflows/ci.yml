name: CI

# Pull requests and pushes to main run the checks. Deno Deploy builds and
# deploys main itself, so there is no deploy job here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs on a PR branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno i

      - name: typecheck (react-router typegen + tsc)
        run: deno task typecheck

      - name: type-check api + server + scripts
        run: deno task check:api

      - run: deno task lint

      - name: web tests (vitest)
        run: deno task test

      - name: api tests (deno test, in-memory KV)
        run: deno task test:api

      - name: build + prerender
        run: deno task build
