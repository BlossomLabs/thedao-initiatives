name: live chain check

# The one part of the suite PR CI skips: verifying every configured token
# contract against mainnet (decimals() and symbol()). It needs the network, so
# it runs on a schedule instead of on every push — a token address that goes
# stale or a contract that changes shape gets caught here rather than by a
# donation being mis-encoded.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tokens:
    name: verify token contracts on mainnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: live token verification
        env:
          # Optional. Without it the run falls back to the public endpoints in
          # config.RPC_ENDPOINTS, which work but get rate-limited.
          RPC_URL: ${{ secrets.RPC_URL }}
        run: python -m unittest discover -s tests -p 'test_core.py' -k TestLiveChain -v
