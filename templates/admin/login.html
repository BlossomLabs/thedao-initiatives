{% extends "base.html" %}
{% block title %}Admin · TheDAO RFPs{% endblock %}
{% block content %}
<main class="detail narrow center">
  <h1>Admin</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_login_post') }}" class="form narrow-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="lbl">Password</label>
    <input type="password" name="password" autofocus>
    <button class="btn primary" type="submit">Log in</button>
  </form>
  <p class="small dim">The password is in the <span class="m">.env</span> file in the app folder.</p>
</main>
{% endblock %}
