{% extends "base.html" %}
{% block title %}Admin · TheDAO Initiatives{% endblock %}
{% block content %}
<main class="detail narrow center">
  <h1>Admin</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_login_post') }}" class="form narrow-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="lbl" for="admin-password">Password</label>
    <input type="password" id="admin-password" name="password" autofocus>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</main>
{% endblock %}
