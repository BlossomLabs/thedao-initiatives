{% extends "base.html" %}
{% block title %}Admin · TheDAO Initiatives{% endblock %}
{% block content %}
<main class="detail narrow center">
  <h1>Admin</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <button id="admin-wallet-login" class="btn primary wallet" type="button">Connect wallet &amp; sign in</button>
  <p id="admin-wallet-note" class="qa-note"></p>
  <div class="or-divider"><span>or</span></div>
  <form method="post" action="{{ url_for('admin_login_post') }}" class="form narrow-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="lbl" for="admin-password">Password</label>
    <input type="password" id="admin-password" name="password">
    <button class="btn" type="submit">Log in</button>
  </form>
</main>
{% endblock %}
